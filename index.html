<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempi di lavoro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tempi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: una sola schermata stile iOS, schede a tutta altezza con barra capsula flottante e fogli modali. */
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --pressed: #E5E5EA;
  --label: #000000; --label2: rgba(60,60,67,.62); --label3: rgba(60,60,67,.32);
  --sep: rgba(60,60,67,.24); --fill: rgba(120,120,128,.13);
  --tint: #007AFF; --tint-soft: rgba(0,122,255,.13); --on-tint: #FFFFFF;
  --green: #34C759; --green-ink: #1B7F37; --green-soft: rgba(52,199,89,.18);
  --orange: #FF9500; --orange-ink: #A85800; --orange-soft: rgba(255,149,0,.18);
  --red: #FF3B30; --red-ink: #D70015; --red-soft: rgba(255,59,48,.13);
  --glass: rgba(255,255,255,.72); --glass-line: rgba(255,255,255,.7);
  --shadow: 0 6px 24px rgba(0,0,0,.13); --dim: rgba(0,0,0,.32);
  --sheet-bg: #F2F2F7; --sheet-card: #FFFFFF; --sheet-pressed: #E5E5EA;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-group: 14px;
  /* Spazi di sicurezza: valgono solo se la pagina occupa davvero tutto lo schermo. */
  --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  --tab-b: max(16px, calc(var(--bot) - 12px));
}
:root.contained { --top: 0px; --bot: 0px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1C1C1E; --pressed: #2C2C2E;
  --label: #FFFFFF; --label2: rgba(235,235,245,.62); --label3: rgba(235,235,245,.32);
  --sep: rgba(84,84,88,.62); --fill: rgba(120,120,128,.26);
  --tint: #0A84FF; --tint-soft: rgba(10,132,255,.22); --on-tint: #FFFFFF;
  --green: #30D158; --green-ink: #30D158; --green-soft: rgba(48,209,88,.2);
  --orange: #FF9F0A; --orange-ink: #FF9F0A; --orange-soft: rgba(255,159,10,.2);
  --red: #FF453A; --red-ink: #FF6961; --red-soft: rgba(255,69,58,.2);
  --glass: rgba(44,44,46,.72); --glass-line: rgba(255,255,255,.1);
  --shadow: 0 6px 24px rgba(0,0,0,.5); --dim: rgba(0,0,0,.55);
  --sheet-bg: #1C1C1E; --sheet-card: #2C2C2E; --sheet-pressed: #3A3A3C;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --pressed: #2C2C2E;
  --label: #FFFFFF; --label2: rgba(235,235,245,.62); --label3: rgba(235,235,245,.32);
  --sep: rgba(84,84,88,.62); --fill: rgba(120,120,128,.26);
  --tint: #0A84FF; --tint-soft: rgba(10,132,255,.22); --on-tint: #FFFFFF;
  --green: #30D158; --green-ink: #30D158; --green-soft: rgba(48,209,88,.2);
  --orange: #FF9F0A; --orange-ink: #FF9F0A; --orange-soft: rgba(255,159,10,.2);
  --red: #FF453A; --red-ink: #FF6961; --red-soft: rgba(255,69,58,.2);
  --glass: rgba(44,44,46,.72); --glass-line: rgba(255,255,255,.1);
  --shadow: 0 6px 24px rgba(0,0,0,.5); --dim: rgba(0,0,0,.55);
  --sheet-bg: #1C1C1E; --sheet-card: #2C2C2E; --sheet-pressed: #3A3A3C;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--bg); color: var(--label); font: 400 17px/1.29 var(--font); letter-spacing: -.02em; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:disabled { cursor: default; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
svg { display: block; }

.app { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
.screen { position: absolute; inset: 0; z-index: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); padding-bottom: calc(var(--tab-b) + 86px); }
.screen:not(.on) { visibility: hidden; }
.has-mini .screen { padding-bottom: calc(var(--tab-b) + 200px); }
#tabAct, #tabProj { padding-bottom: calc(var(--tab-b) + 146px); }
.has-mini #tabAct, .has-mini #tabProj { padding-bottom: calc(var(--tab-b) + 206px); }
.pad { max-width: 600px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }

/* Barra di navigazione */
.nav { position: sticky; top: 0; z-index: 5; padding-top: var(--top); transition: background .2s; }
.nav-in { max-width: 600px; margin-inline: auto; height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav-title { font-weight: 600; opacity: 0; transition: opacity .2s; max-width: 56vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scrolled .nav { background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 .5px 0 var(--sep); }
.scrolled .nav-title { opacity: 1; }
.nav-r { justify-self: end; }
.round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--tint); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.round:active { background: var(--pressed); }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--tint); min-height: 44px; padding-right: 8px; }
.large { font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -.03em; text-wrap: balance; }
.head { display: flex; flex-direction: column; gap: 2px; margin-bottom: -10px; }
.head p { color: var(--label2); font-size: 15px; }

/* Timer */
.nav.thin { height: calc(var(--top) + 12px); padding-top: 0; }
.timer { padding-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.ic { display: block; width: 1em; height: 1em; }
.clock { font-size: clamp(56px, 21vw, 96px); line-height: 1.05; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; }
.state { font-size: 13px; line-height: 18px; color: var(--label2); min-height: 18px; text-align: center; margin-top: -10px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
.dot.paused { background: var(--orange); }
.running .dot:not(.paused) { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.ctrl { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.circle { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; transition: transform .12s, background .15s, color .15s; }
.circle:active:not(:disabled) { transform: scale(.94); }
.circle.go { background: var(--green-soft); color: var(--green-ink); }
.circle.hold { background: var(--orange-soft); color: var(--orange-ink); }
.circle.end { background: var(--fill); color: var(--label); }
.circle:disabled { background: var(--fill); color: var(--label3); }

/* Gruppi e righe */
.section { display: flex; flex-direction: column; gap: 7px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-inline: 16px; font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; }
.sec-h.big { padding-inline: 4px; font-size: 20px; line-height: 1.2; font-weight: 600; color: var(--label); }
.sec-h.big span { font-size: 15px; font-weight: 400; color: var(--label2); }
.sec-f { padding-inline: 16px; font-size: 13px; color: var(--label2); }
.group { background: var(--card); border-radius: var(--r-group); overflow: hidden; }
.sw { position: relative; overflow: hidden; background: var(--card); }
.fg { position: relative; z-index: 1; background: var(--card); display: flex; align-items: center; min-height: 52px; touch-action: pan-y; --inset: 16px; }
.fg::after { content: ""; position: absolute; left: var(--inset); right: 0; bottom: 0; height: .5px; background: var(--sep); }
.noLast .sw:last-child .fg::after, .noLast > .fg:last-child::after { display: none; }
.sw-acts { position: absolute; inset: 0 0 0 auto; display: flex; visibility: hidden; }
.sw.reveal .sw-acts { visibility: visible; }
.sw-acts button { width: 80px; display: grid; place-items: center; color: #FFFFFF; font-size: 15px; font-weight: 500; }
.sw-acts .del { background: #E0352B; }
.row-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 16px; min-height: 52px; }
.row-btn:active, .link-row:active { background: var(--pressed); }
.stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.stack b { font-weight: 400; overflow-wrap: anywhere; }
.stack small { font-size: 13px; color: var(--label2); overflow-wrap: anywhere; white-space: pre-line; font-variant-numeric: tabular-nums; }
.val { flex: none; color: var(--label2); font-size: 15px; font-variant-numeric: tabular-nums; }
.play { flex: none; width: 56px; height: 72px; display: grid; place-items: center end; }
.play i { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: var(--green-soft); color: var(--green-ink); }
.play:active i { filter: brightness(.9); }
.play.ring i { background: none; box-shadow: inset 0 0 0 3px var(--orange); color: var(--orange-ink); }
.plain.group { background: none; border-radius: 0; overflow: visible; }
.plain ul { border-top: .5px solid var(--sep); }
.plain .sw, .plain .fg { background: var(--bg); }
.plain .fg { --inset: 0px; min-height: 72px; }
.plain .row-btn { padding: 10px 8px 10px 0; min-height: 72px; }
.plain .row-btn:hover, .plain .row-btn:active { background: none; }
.plain .stack { gap: 2px; }
.plain .stack b { font-size: 20px; line-height: 1.2; }
.plain .stack small { font-size: 15px; }
.chev { flex: none; color: var(--label2); }
.sess .row-btn { padding: 10px 16px; min-height: 62px; }
.sess .stack b { font-weight: 600; }
.sess .stack small { font-size: 15px; }
.sess .val { font-size: 17px; }
.field input.switch { -webkit-appearance: none; appearance: none; flex: none; position: relative; width: 51px; height: 31px; padding: 0; margin: 0 16px 0 auto; border-radius: 16px; background: var(--fill); transition: background .18s; cursor: pointer; }
.field input.switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .18s; }
.field input.switch:checked { background: var(--green); }
.field input.switch:checked::before { transform: translateX(20px); }
.ro { margin-left: auto; padding: 12px 16px 12px 12px; color: var(--label2); font-variant-numeric: tabular-nums; }
.link-row { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 16px; color: var(--tint); position: relative; }
.link-row.danger { color: var(--red-ink); justify-content: center; }
.empty { padding: 20px 16px; color: var(--label2); text-align: center; font-size: 15px; }

/* To-do */
.todo .fg { --inset: 52px; align-items: stretch; }
.check { flex: none; width: 52px; display: grid; place-items: center; }
.check i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--label3); color: transparent; transition: background .15s, box-shadow .15s; }
.check[aria-checked="true"] i { background: var(--tint); box-shadow: none; color: var(--on-tint); }
.todo-text { flex: 1; min-width: 0; padding: 14px 4px; overflow-wrap: anywhere; line-height: 24px; }
.is-done .todo-text { color: var(--label2); text-decoration: line-through; text-decoration-color: var(--label3); }
.todo-edit { flex: 1; min-width: 0; border: 0; background: none; padding: 14px 4px; line-height: 24px; outline: none; resize: none; font-size: 17px; display: block; height: 52px; overflow: hidden; }
.handle { flex: none; width: 48px; display: grid; place-items: center; color: var(--label3); touch-action: none; cursor: grab; }
.todo .play, .phase .play { width: 44px; height: auto; place-items: center; }
.todo .play i, .phase .play i { width: 34px; height: 34px; font-size: 15px; }
.todo .play.ring i, .phase .play.ring i { box-shadow: inset 0 0 0 2.5px var(--orange); }
.phase .fg { align-items: stretch; }
.phase .row-btn { padding-right: 4px; }
.phase .fg { padding-right: 11px; }
.sw.lift { overflow: visible; z-index: 3; box-shadow: var(--shadow); }
.sw.lift .handle { color: var(--tint); cursor: grabbing; }
.sw.shift { transition: transform .18s ease; }
.addrow { display: flex; align-items: center; min-height: 52px; }
.addrow label { flex: none; width: 52px; display: grid; place-items: center; color: var(--tint); }
.addrow input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 14px 16px 14px 4px; font-size: 17px; }
.addrow input::placeholder { color: var(--label2); }
.disclose { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 4px 16px; min-height: 36px; color: var(--label2); font-size: 15px; }
.disclose svg { transition: transform .2s; }
.disclose[aria-expanded="true"] svg { transform: rotate(90deg); }
.clear { color: var(--tint); font-size: 15px; padding: 4px 16px; align-self: flex-start; min-height: 36px; }

/* Dettaglio */
#detail { z-index: 2; }
#detail.in { animation: push .28s cubic-bezier(.32,.72,0,1); }
@keyframes push { from { transform: translateX(100%); } }
.dt-title { width: 100%; border: 0; background: none; outline: none; resize: none; padding: 0; font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -.03em; display: block; overflow: hidden; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--card); border-radius: var(--r-group); }
.stats div { padding: 12px 8px 12px 16px; min-width: 0; }
.stats div + div { box-shadow: -.5px 0 0 var(--sep); }
.stats small { display: block; font-size: 13px; color: var(--label2); }
.stats b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.primary { width: 100%; min-height: 50px; border-radius: 25px; background: var(--green-soft); color: var(--green-ink); font-weight: 600; text-align: center; }
.primary:active { filter: brightness(.94); }
.primary:disabled { background: var(--fill); color: var(--label2); }
.destructive { width: 100%; min-height: 50px; border-radius: 25px; background: var(--red-soft); color: var(--red-ink); font-weight: 600; text-align: center; }
.destructive:active { filter: brightness(.94); }
.notes { width: 100%; border: 0; background: none; outline: none; resize: none; padding: 12px 16px; display: block; min-height: 76px; overflow: hidden; font-size: 17px; }
.notes::placeholder { color: var(--label2); }
#tNote, #pNote { min-height: 48px; padding-block: 13px; }

/* Allegati */
.att { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 0 16px 12px; }
.att::before { content: ""; position: absolute; left: 16px; right: 0; top: 0; height: .5px; background: var(--sep); }
.att-grid { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
.att-grid:empty { display: none; }
.thumb { position: relative; width: 72px; height: 72px; flex: none; }
.thumb > a, .thumb > button { width: 100%; height: 100%; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: var(--fill); color: var(--label2); text-decoration: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .pdf { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; text-align: center; }
.thumb .pdf b { font-size: 12px; font-weight: 700; color: var(--red-ink); letter-spacing: .02em; }
.thumb .pdf small { font-size: 10px; line-height: 1.15; color: var(--label2); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.thumb .rm { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--label); color: var(--bg); box-shadow: 0 0 0 2px var(--card); }
.thumb.busy > div { width: 100%; height: 100%; border-radius: 10px; background: var(--fill); display: grid; place-items: center; font-size: 12px; color: var(--label2); }
.att-acts { display: flex; gap: 8px; padding-top: 12px; }
.att-grid:not(:empty) + .att-acts { padding-top: 0; }
.att-btn { position: relative; flex: 1; min-height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--tint-soft); color: var(--tint); font-size: 15px; font-weight: 500; cursor: pointer; overflow: hidden; }
.att-btn:active { filter: brightness(.94); }
.att-btn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 0; }
.att-btn:focus-within { outline: 2px solid var(--tint); outline-offset: 2px; }
#viewer { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #000000; border-radius: 0; box-shadow: none; animation: fade .2s; }
#viewer::backdrop { background: #000000; }
#viewer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#viewer .x { position: absolute; top: calc(var(--top) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); z-index: 1; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(60,60,67,.7); color: #FFFFFF; }

/* Mini barra + capsula + avvisi */
.mini { position: absolute; left: 50%; bottom: calc(var(--tab-b) + 66px); transform: translateX(-50%); z-index: 6; width: min(calc(100% - 32px), 520px); height: 52px; border-radius: 26px; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); box-shadow: var(--shadow), inset 0 0 0 .5px var(--glass-line); display: flex; align-items: center; }
.mini-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 100%; padding-left: 18px; }
.mini-open span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; }
.mini-open time { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--label2); }
.mini-btn { width: 52px; height: 52px; display: grid; place-items: center; font-size: 22px; color: var(--label); }
.fab { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tab-b) + 70px); z-index: 7; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--on-tint); box-shadow: var(--shadow); transition: transform .12s; }
.fab:active { transform: scale(.94); }
.has-mini .fab { bottom: calc(var(--tab-b) + 130px); }
.tabs { position: absolute; left: 50%; bottom: var(--tab-b); transform: translateX(-50%); z-index: 6; width: min(calc(100% - 32px), 440px); height: 58px; padding: 4px; border-radius: 29px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); box-shadow: var(--shadow), inset 0 0 0 .5px var(--glass-line); }
.tab { border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--label); transition: background .18s, color .18s; position: relative; }
.tab[aria-current="page"] { color: var(--tint); background: var(--fill); }
.badge { position: absolute; top: 3px; left: calc(50% + 10px); min-width: 17px; height: 17px; padding-inline: 5px; border-radius: 9px; background: var(--red); color: #FFFFFF; font-size: 11px; line-height: 17px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.toast { position: absolute; left: 50%; bottom: calc(var(--tab-b) + 70px); transform: translateX(-50%); z-index: 20; width: min(calc(100% - 32px), 420px); min-height: 48px; padding: 6px 8px 6px 18px; border-radius: 24px; background: var(--label); color: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; box-shadow: var(--shadow); animation: rise .22s ease; }
.has-mini .toast { bottom: calc(var(--tab-b) + 128px); }
.toast button { flex: none; color: var(--tint); font-weight: 600; padding: 6px 12px; min-height: 36px; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } }

/* Foglio modale */
dialog { --bg: var(--sheet-bg); --card: var(--sheet-card); --pressed: var(--sheet-pressed); position: fixed; inset: auto 0 0; margin: 0 auto; width: 100%; max-width: 600px; height: auto; max-height: calc(100vh - var(--top) - 28px); max-height: calc(100dvh - var(--top) - 28px); border: 0; padding: 0; background: var(--sheet-bg); color: var(--label); border-radius: 26px 26px 0 0; overflow-y: auto; overscroll-behavior: contain; box-shadow: 0 -8px 40px rgba(0,0,0,.28); animation: sheet .3s cubic-bezier(.32,.72,0,1); }
dialog:focus { outline: none; }
dialog::backdrop { background: var(--dim); animation: fade .25s; }
dialog.closing { animation: sheet-out .2s ease-in forwards; }
dialog.closing::backdrop { opacity: 0; transition: opacity .2s; }
@keyframes sheet { from { transform: translateY(100%); } }
@keyframes sheet-out { to { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.sh-nav { position: sticky; top: 0; z-index: 2; background: var(--sheet-bg); display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 8px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); touch-action: none; cursor: grab; }
.sh-nav::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--label3); }
.sh-nav h2 { font-size: 17px; line-height: 1.2; font-weight: 600; text-align: center; text-wrap: balance; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.sh-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--label); }
.sh-btn:active { filter: brightness(.9); }
.sh-btn.ok { justify-self: end; background: var(--tint); color: var(--on-tint); transition: background .15s; }
.sh-btn.ok:disabled { background: var(--fill); color: var(--label3); }
.sh-body { padding-block: 8px calc(max(var(--bot), 26px) + 16px); gap: 20px; }
.sum { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.sum b { font-size: 42px; font-weight: 200; font-variant-numeric: tabular-nums; line-height: 1.15; }
.sum small { font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; }
.sheet-danger { align-self: center; min-height: 44px; padding-inline: 16px; color: var(--red-ink); font-size: 15px; }
.pick { position: relative; width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 16px; }
.pick:active { background: var(--pressed); }
.pick:not(:last-child)::after { content: ""; position: absolute; left: 16px; right: 0; bottom: 0; height: .5px; background: var(--sep); }
.pick .tick { flex: none; width: 20px; color: var(--tint); }
.field { display: flex; align-items: center; min-height: 50px; padding-left: 16px; position: relative; }
.field input[type="date"], .field input[type="time"] { -webkit-appearance: none; appearance: none; flex: none; width: auto; margin: 0 16px 0 auto; height: 34px; line-height: 34px; padding: 0 12px; border-radius: 17px; background: var(--fill); color: var(--label); text-align: center; font-variant-numeric: tabular-nums; }
.field input::-webkit-date-and-time-value { text-align: center; margin: 0; min-height: 0; }
@media (pointer: coarse) {
  .field input[type="date"] { width: 132px; }
  .field input[type="time"] { width: 84px; }
  .field input::-webkit-calendar-picker-indicator { display: none; }
}
.field:not(:last-child)::after, .fsep::after { content: ""; position: absolute; left: 16px; right: 0; bottom: 0; height: .5px; background: var(--sep); }
.field > span { flex: none; }
.field input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 12px 16px 12px 12px; text-align: right; font-size: 17px; }
.field.full { padding: 0; }
.field.full input { text-align: left; padding: 13px 16px; }
input::placeholder { color: var(--label2); }

@media (max-height: 740px) {
  .timer { padding-top: 10px; gap: 10px; }
  .circle { width: 72px; height: 72px; font-size: 30px; }
  .pad { gap: 20px; }
}
@media (hover: hover) { .row-btn:hover, .link-row:hover { background: var(--fill); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after, dialog::backdrop { animation: none !important; transition: none !important; } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); pointer-events: none; }
html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>


<div class="app" id="app">
  <section class="screen on" id="tabTime" aria-label="Attività">
    <header class="nav thin"></header>
    <div class="pad">
      <div class="group" id="tBox">
        <label class="field"><span>Attività</span><input id="tTitle" type="text" placeholder="Cosa stai facendo?" autocomplete="off" enterkeyhint="done" maxlength="120"></label>
        <textarea class="notes" id="tNote" rows="1" placeholder="Note" aria-label="Note" autocomplete="off" maxlength="10000"></textarea>
        <div id="tFiles"></div>
      </div>
      <div class="timer" id="timerCard">
        <div class="clock" id="clock" role="timer">00:00:00</div>
        <div class="state" id="tState"></div>
        <div class="ctrl">
          <button class="circle end" id="btnStop" data-a="stop" aria-label="Ferma"></button>
          <button class="circle go" id="btnMain" data-a="main" aria-label="Avvia"></button>
        </div>
      </div>
      <div class="section">
        <div class="sec-h big"><h2 style="font:inherit">Recenti</h2><span id="todayTimer"></span></div>
        <div class="group plain"><ul id="recList"></ul></div>
        <p class="sec-f" id="sync" hidden></p>
      </div>
    </div>
  </section>

  <section class="screen" id="tabAct" aria-label="Attività">
    <header class="nav"><div class="nav-in"><span></span><span class="nav-title">Attività</span><span style="height:40px"></span></div></header>
    <div class="pad">
      <div class="head"><h1 class="large">Attività</h1><p id="todayTotal"></p></div>
      <div class="group plain"><ul id="actList"></ul></div>
    </div>
  </section>

  <section class="screen" id="tabProj" aria-label="Progetti">
    <header class="nav"><div class="nav-in"><span></span><span class="nav-title">Progetti</span>
      <span style="height:40px"></span>
    </div></header>
    <div class="pad">
      <div class="head"><h1 class="large">Progetti</h1><p id="projTotal"></p></div>
      <div class="group plain"><ul id="projList"></ul></div>
    </div>
  </section>

  <section class="screen" id="detail" aria-label="Dettaglio attività" hidden></section>

  <section class="screen" id="tabTodo" aria-label="Da fare">
    <header class="nav"><div class="nav-in"><span></span><span class="nav-title">Da fare</span><span style="height:40px"></span></div></header>
    <div class="pad">
      <div class="head"><h1 class="large">Da fare</h1><p id="todoCount"></p></div>
      <div class="section">
        <div class="group todo">
          <ul id="todoList"></ul>
          <form class="addrow" id="addTodo" autocomplete="off">
            <label for="newTodo" aria-label="Nuova cosa da fare"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7.5v9M7.5 12h9"/></svg></label>
            <input id="newTodo" type="text" placeholder="Aggiungi" enterkeyhint="done" maxlength="200">
          </form>
        </div>
        <p class="sec-f">Tocca il testo per modificarlo. Trascina le tre linee per cambiare ordine. Premi play per avviare il timer. Scorri a sinistra per eliminare.</p>
      </div>
      <div class="section" id="doneWrap" hidden>
        <button class="disclose" id="doneToggle" data-a="toggleDone" aria-expanded="false" aria-controls="doneBody"><span id="doneLabel"></span><svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l6 6-6 6"/></svg></button>
        <div id="doneBody" class="section" hidden>
          <div class="group todo"><ul class="noLast" id="doneList"></ul></div>
          <button class="clear" data-a="clearDone">Elimina le completate</button>
        </div>
      </div>
    </div>
  </section>

  <div class="mini" id="mini" hidden>
    <button class="mini-open" data-a="goTimer" aria-label="Apri il timer"><span class="dot" id="miniDot"></span><span id="miniTitle"></span><time id="miniClock"></time></button>
    <button class="mini-btn" id="miniBtn" data-a="main"></button>
  </div>

  <button class="fab" id="fab" data-a="newItem" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg></button>

  <nav class="tabs" aria-label="Sezioni">
    <button class="tab" data-a="tab" data-tab="time"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="14.5" r="8.5"/><path d="M13 9.5v5l3 2M10.5 2.5h5"/></svg>Timer</button>
    <button class="tab" data-a="tab" data-tab="act"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.5 6.5h13M9.5 13h13M9.5 19.5h13"/><circle cx="4.5" cy="6.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="19.5" r="1.3" fill="currentColor" stroke="none"/></svg>Attività</button>
    <button class="tab" data-a="tab" data-tab="proj"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h5l2.5 2.8H21a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Progetti</button>
    <button class="tab" data-a="tab" data-tab="todo"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7l2 2 3.5-4M3.5 17l2 2 3.5-4M13 7.5h9.5M13 17.5h9.5"/></svg>Da fare<span class="badge" id="todoBadge" hidden></span></button>
  </nav>

  <div id="toastHost" role="status" aria-live="polite"></div>
  <dialog id="sheet" aria-labelledby="sheetTitle"></dialog>
  <dialog id="viewer" aria-label="Foto"><button class="x" data-a="closeViewer" aria-label="Chiudi"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2.5 2.5l11 11M13.5 2.5l-11 11"/></svg></button><img id="viewerImg" alt=""></dialog>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const norm = s => (s || '').trim().toLocaleLowerCase('it');
  const clone = o => JSON.parse(JSON.stringify(o));
  const pad = n => String(n).padStart(2, '0');

  const ICON = {
    play: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M7.2 4.6l13 7.4-13 7.4z"/></svg>',
    pause: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="3.5" width="5.2" height="17" rx="1.6"/><rect x="13.8" y="3.5" width="5.2" height="17" rx="1.6"/></svg>',
    stop: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="5.5" width="13" height="13" rx="3"/></svg>',
    chev: '<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>',
    back: '<svg width="11" height="19" viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5l-8 8 8 8"/></svg>',
    check: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>',
    grip: '<svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2h16M2 7h16M2 12h16"/></svg>',
    plus: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7.5v9M7.5 12h9"/></svg>'
  };

  /* ---------- Allegati ---------- */
  let assetsApi = null, sheetFiles = [];
  const urlCache = new Map(), busyFiles = new Map();
  const idb = (() => {
    let p;
    const open = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open('tempi-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
    const tx = (m, fn) => open().then(d => new Promise((res, rej) => { const t = d.transaction('f', m), rq = fn(t.objectStore('f')); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); }));
    return { put: (k, v) => tx('readwrite', st => st.put(v, k)), get: k => tx('readonly', st => st.get(k)), del: k => tx('readwrite', st => st.delete(k)) };
  })();
  const ICON_CAM = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.6-2h5.8l1.6 2h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>';
  const ICON_CLIP = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-8.1 8.1a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>';
  const ICON_X = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8"/></svg>';
  const fileUrl = f => f.asset ? (urlCache.get(f.id) || '/_blob/' + f.asset) : urlCache.get(f.id) || '';
  function filesHTML(files, ctx) {
    const list = files || [], busy = busyFiles.get(ctx) || 0;
    const thumbs = list.map(f => {
      const u = fileUrl(f), name = esc(f.name || (f.type === 'application/pdf' ? 'Documento.pdf' : 'Foto.jpg'));
      const inner = f.type === 'application/pdf'
        ? `<a href="${esc(u) || '#'}" target="_blank" rel="noopener" data-fid="${f.id}" class="${f.asset ? '' : 'needs-url'}" aria-label="Apri ${name}"><span class="pdf"><b>PDF</b><small>${name}</small></span></a>`
        : `<button type="button" data-a="openFile" data-fid="${f.id}" aria-label="Apri foto"><img alt="" ${u ? `src="${esc(u)}"` : ''} data-fid="${f.id}" class="${f.asset ? '' : 'needs-url'}"></button>`;
      return `<div class="thumb">${inner}<button type="button" class="rm" data-a="rmFile" data-fid="${f.id}" data-ctx="${ctx}" aria-label="Rimuovi ${name}">${ICON_X}</button></div>`;
    }).join('') + Array.from({ length: busy }, () => '<div class="thumb busy"><div>Carico…</div></div>').join('');
    return `<div class="att" data-ctx="${ctx}"><div class="att-grid">${thumbs}</div><div class="att-acts">
      <label class="att-btn">${ICON_CAM}<span>Scatta foto</span><input type="file" accept="image/*" capture="environment" data-att="${ctx}" aria-label="Scatta foto"></label>
      <label class="att-btn">${ICON_CLIP}<span>Allega file</span><input type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/*,application/pdf,.pdf,.jpg,.jpeg" multiple data-att="${ctx}" aria-label="Allega foto o PDF"></label>
    </div></div>`;
  }
  function hydrateFiles(root = document) {
    root.querySelectorAll('.needs-url[data-fid]').forEach(async el => {
      const id = el.dataset.fid;
      let u = urlCache.get(id);
      if (!u) {
        try { const b = await idb.get(id); if (b) { u = URL.createObjectURL(b); urlCache.set(id, u); } } catch {}
      }
      if (!u) { if (el.tagName === 'IMG') el.replaceWith(Object.assign(document.createElement('span'), { textContent: 'Non qui' })); return; }
      if (el.tagName === 'IMG') el.src = u; else el.href = u;
      el.classList.remove('needs-url');
    });
  }
  const getFiles = ctx => ctx === 'timer' ? (S.timer.files || []) : ctx === 'detail' ? ((S.activities[detailId] || {}).files || []) : sheetFiles;
  function setFiles(ctx, files) {
    if (ctx === 'timer') putTimer({ ...S.timer, files });
    else if (ctx === 'detail') { const a = S.activities[detailId]; if (a) putActivity({ ...clone(a), files }); }
    else { sheetFiles = files; refreshSheetFiles(); }
  }
  function refreshSheetFiles() { const el = dlg.querySelector('.att[data-ctx="sheet"]'); if (el) { el.outerHTML = filesHTML(sheetFiles, 'sheet'); hydrateFiles(dlg); } }
  function refreshCtx(ctx) { if (ctx === 'sheet') refreshSheetFiles(); else render(); }
  async function toJpeg(file) {
    let src;
    try { src = await createImageBitmap(file); }
    catch { src = await new Promise((res, rej) => { const i = new Image(), u = URL.createObjectURL(file); i.onload = () => res(i); i.onerror = rej; i.src = u; }); }
    const w = src.width, h = src.height, k = Math.min(1, 2048 / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', .82));
  }
  async function storeFile(blob, type, name) {
    const id = uid(), rec = { id, type, name, size: blob.size, addedAt: Date.now() };
    if (assetsApi) {
      let r;
      try { r = await assetsApi.upload(blob, { type }); }
      catch (e) { if (e && e.code === 'store_unavailable') { await new Promise(x => setTimeout(x, 900)); r = await assetsApi.upload(blob, { type }); } else throw e; }
      rec.asset = r.id; urlCache.set(id, r.url);
    } else {
      await idb.put(id, blob);
      urlCache.set(id, URL.createObjectURL(blob));
    }
    return rec;
  }
  async function addFiles(ctx, list) {
    const items = [...list];
    if (!items.length) return;
    busyFiles.set(ctx, (busyFiles.get(ctx) || 0) + items.length); refreshCtx(ctx);
    const added = [];
    for (const f of items) {
      try {
        const pdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
        if (!pdf && !/^image\//.test(f.type || '') && !/\.(jpe?g|png|heic|heif)$/i.test(f.name || '')) { toast('Puoi allegare solo foto e PDF'); continue; }
        if (pdf && f.size > 20 * 1024 * 1024) { toast('Il PDF supera 20 MB'); continue; }
        const blob = pdf ? f : await toJpeg(f);
        const name = pdf ? (f.name || 'Documento.pdf') : (f.name ? f.name.replace(/\.[^.]+$/, '') + '.jpg' : 'Foto.jpg');
        added.push(await storeFile(blob, pdf ? 'application/pdf' : 'image/jpeg', name));
      } catch (e) {
        toast(e && e.code === 'quota_or_state' ? 'Spazio per gli allegati esaurito' : e && e.code === 'too_large' ? 'File troppo grande' : 'Non sono riuscito a caricare il file. Riprova.');
      } finally { busyFiles.set(ctx, Math.max(0, (busyFiles.get(ctx) || 1) - 1)); }
    }
    setFiles(ctx, [...getFiles(ctx), ...added]);
    if (!added.length) refreshCtx(ctx);
  }
  // Elimina dall'archivio gli allegati che non sono più usati da nessuna parte (dopo il tempo per annullare).
  function referenced() {
    const ids = new Set();
    const add = l => (l || []).forEach(f => ids.add(f.id));
    Object.values(S.activities).forEach(a => { add(a.files); a.sessions.forEach(x => add(x.files)); });
    add(S.timer.files); add(sheetFiles);
    return ids;
  }
  const trash = new Map();
  function gcLater(files) {
    (files || []).forEach(f => trash.set(f.id, f));
    setTimeout(() => {
      const keep = referenced();
      for (const [id, f] of [...trash]) {
        if (keep.has(id)) { trash.delete(id); continue; }
        trash.delete(id);
        if (f.asset) { if (assetsApi) assetsApi.delete(f.asset).catch(() => {}); }
        else idb.del(id).catch(() => {});
        const u = urlCache.get(id); if (u && u.startsWith('blob:')) URL.revokeObjectURL(u); urlCache.delete(id);
      }
    }, 8000);
  }
  document.addEventListener('change', e => {
    const inp = e.target.closest && e.target.closest('input[type=file][data-att]');
    if (!inp) return;
    const files = inp.files; addFiles(inp.dataset.att, files).finally(() => { try { inp.value = ''; } catch {} });
  });
  const viewer = document.getElementById('viewer');
  viewer.addEventListener('click', e => { if (e.target === viewer || e.target.id === 'viewerImg') viewer.close(); });

  /* ---------- Formati ---------- */
  const fmtClock = ms => { const s = Math.floor(ms / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
  const fmtDur = ms => {
    const s = Math.round(ms / 1000);
    if (s < 60) return `${s} s`;
    const m = Math.round(s / 60);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h} h ${pad(r)} min` : `${h} h`;
  };
  const fmtTime = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  /* ---------- Stato e salvataggio ---------- */
  const IDLE = { status: 'idle', title: '', activityId: '', sessionId: '', startedAt: 0, segStart: 0, accumulated: 0, pausedAt: 0, note: '' };

  function mergeCol(name, snap) {

    for (const id of new Set([...Object.keys(next), ...Object.keys(S[name])])) {

  /* ---------- Timer ---------- */

  const codeOf = (a, s) => `${term(a).code}${sessionNum(a, s)}`;

  function renderMini() {

  }
  const total = a => a.sessions.reduce((n, s) => n + s.ms, 0);

  const lastAt = a => a.sessions.reduce((n, s) => Math.max(n, s.start), 0);

  function renderActivities() {

  const todoSorted = done => Object.values(S.todos).filter(t => !!t.done === done).sort((a, b) => done ? (b.doneAt || 0) - (a.doneAt || 0) : a.order - b.order);

      inp.focus();
      const sc = $('#tabTodo'); sc.scrollTop = Math.max(sc.scrollTop, 0);
      inp.scrollIntoView({ block: 'nearest' });
    }
  });

  /* ---------- Scorrimento laterale ---------- */
  let swipeState = null, openRow = null;
  function closeOpenRow() {
    if (!openRow) return;
    const fg = openRow.querySelector('.fg'), r = openRow;
    openRow = null;
    fg.style.transition = 'transform .2s ease'; fg.style.transform = '';
    r.querySelectorAll('.sw-acts button').forEach(b => b.tabIndex = -1);
    setTimeout(() => { r.classList.remove('reveal'); fg.style.transition = ''; if (renderLater) render(); }, 200);
  }
  document.addEventListener('pointerdown', e => {
    if (openRow && !e.target.closest('.sw-acts')) { const same = openRow.contains(e.target); closeOpenRow(); if (same) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 400); } return; }
    const fg = e.target.closest('.sw .fg');
    if (!fg || !fg.closest('.sw').querySelector('.sw-acts') || e.target.closest('.handle') || editingTodo) return;
    if (e.button) return;
    swipeState = { fg, li: fg.closest('.sw'), x: e.clientX, y: e.clientY, id: e.pointerId, on: false, dx: 0 };
  });
  document.addEventListener('pointermove', e => {
    const s = swipeState;
    if (!s || e.pointerId !== s.id) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.on) {
      if (Math.abs(dy) > 10) { swipeState = null; flushHold(); return; }
      if (dx < -8 && Math.abs(dx) > Math.abs(dy)) { s.on = true; s.li.classList.add('reveal'); s.w = s.li.querySelector('.sw-acts').offsetWidth; try { s.fg.setPointerCapture(e.pointerId); } catch {} }
      else return;
    }
    s.dx = Math.max(-s.w - 24, Math.min(0, dx));
    s.fg.style.transform = `translateX(${s.dx}px)`;
  });
  function endSwipe(e) {
    const s = swipeState;
    if (!s || (e.pointerId !== s.id)) return;
    swipeState = null;
    if (!s.on) { flushHold(); return; }
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
    s.fg.style.transition = 'transform .2s ease';
    if (s.dx < -s.w / 2) {
      s.fg.style.transform = `translateX(${-s.w}px)`; openRow = s.li;
      s.li.querySelectorAll('.sw-acts button').forEach(b => b.tabIndex = 0);
    } else { s.fg.style.transform = ''; setTimeout(() => s.li.classList.remove('reveal'), 200); }
    setTimeout(() => { s.fg.style.transition = ''; flushHold(); }, 210);
  }
  const flushHold = () => { if (renderLater && !holding()) render(); };
  document.addEventListener('pointerup', endSwipe);
  document.addEventListener('pointercancel', endSwipe);

  /* ---------- Riordino ---------- */
  let dragState = null;
  const list = $('#todoList');
  list.addEventListener('pointerdown', e => {
    const h = e.target.closest('.handle');
    if (!h || e.button) return;
    e.preventDefault();
    const li = h.closest('.sw'), items = [...list.children], from = items.indexOf(li), sc = $('#tabTodo');
    dragState = { li, h, items, from, to: from, sc, sc0: sc.scrollTop, y0: e.clientY, y: e.clientY, rects: items.map(x => x.getBoundingClientRect()), id: e.pointerId, run: true };
    h.setPointerCapture(e.pointerId);
    li.classList.add('lift');
    items.forEach(x => { if (x !== li) x.classList.add('shift'); });
    const loop = () => {
      const d = dragState;
      if (!d || !d.run) return;
      const r = d.sc.getBoundingClientRect();
      if (d.y < r.top + 110) d.sc.scrollTop -= 6; else if (d.y > r.bottom - 130) d.sc.scrollTop += 6;
      dragUpdate();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
  function dragUpdate() {
    const d = dragState, { rects, from, items } = d, last = rects.length - 1;
    const min = rects[0].top - rects[from].top, max = rects[last].bottom - rects[from].bottom;
    const dy = Math.max(min, Math.min(max, d.y - d.y0 + d.sc.scrollTop - d.sc0));
    d.li.style.transform = `translateY(${dy}px)`;
    const h = rects[from].height, top = rects[from].top + dy, bottom = top + h;
    let to = from;
    for (let i = from + 1; i <= last; i++) if (bottom > rects[i].top + rects[i].height / 2) to = i;
    for (let i = from - 1; i >= 0; i--) if (top < rects[i].top + rects[i].height / 2) to = i;
    d.to = to;
    items.forEach((x, i) => {
      if (i === from) return;
      x.style.transform = i > from && i <= to ? `translateY(${-h}px)` : i < from && i >= to ? `translateY(${h}px)` : '';
    });
  }
  list.addEventListener('pointermove', e => { const d = dragState; if (d && e.pointerId === d.id) { d.y = e.clientY; dragUpdate(); } });
  function endDrag(e, commit) {
    const d = dragState;
    if (!d || e.pointerId !== d.id) return;
    d.run = false; dragState = null;
    d.items.forEach(x => { x.classList.remove('shift', 'lift'); x.style.transform = ''; });
    if (commit && d.to !== d.from) moveTodo(d.li.dataset.id, d.to); else render();
  }
  list.addEventListener('pointerup', e => endDrag(e, true));
  list.addEventListener('pointercancel', e => endDrag(e, false));
  function moveTodo(id, to) {
    const rows = todoSorted(false), from = rows.findIndex(t => t.id === id);
    const [it] = rows.splice(from, 1);
    rows.splice(to, 0, it);
    const prev = rows[to - 1], next = rows[to + 1];
    const order = prev && next ? (prev.order + next.order) / 2 : prev ? prev.order + 1024 : next ? next.order - 1024 : 0;
    putTodo({ ...clone(it), order });
  }
  list.addEventListener('keydown', e => {
    const h = e.target.closest('.handle');
    if (!h || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    const id = h.closest('.sw').dataset.id, rows = todoSorted(false), i = rows.findIndex(t => t.id === id), to = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (to < 0 || to >= rows.length) return;
    moveTodo(id, to);
    const again = list.querySelector(`[data-id="${id}"] .handle`);
    if (again) again.focus();
  });

  boot();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>

</body>
